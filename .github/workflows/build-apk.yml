name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clean Old Files & Extract ONLY Newest Zip
        run: |
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties
          # 找到仓库里最大/最新上传的那个 zip 解压（兼容 source (1).zip、source (2).zip）
          NEWEST_ZIP=$(ls -v *.zip | tail -n 1)
          echo "正在解压最新上传的压缩包: $NEWEST_ZIP"
          unzip -o "$NEWEST_ZIP"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Notes-Fluid-v2-APK
          path: app/build/outputs/apk/debug/*.apk
