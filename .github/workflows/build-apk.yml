name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clean Old Files & Extract v4 Fixed Zip
        run: |
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties
          if ls coloros17_v4_fixed*.zip 1> /dev/null 2>&1; then
            ZIP_TO_USE=$(ls -t coloros17_v4_fixed*.zip | head -n 1)
          else
            ZIP_TO_USE=$(ls -t *.zip | head -n 1)
          fi
          echo "✅ 正在解压: $ZIP_TO_USE"
          unzip -o "$ZIP_TO_USE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-AINotes-v4-RealUI-APK
          path: app/build/outputs/apk/debug/*.apk
