name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Extract Zip
        run: |
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties
          if ls coloros17_v4_fixed*.zip 1> /dev/null 2>&1; then
            ZIP_TO_USE=$(ls -t coloros17_v4_fixed*.zip | head -n 1)
          else
            ZIP_TO_USE=$(ls -t *.zip | head -n 1)
          fi
          echo "✅ 正在解压: $ZIP_TO_USE"
          unzip -o "$ZIP_TO_USE"

      - name: 3. Auto-Fix UI Code (自动修复语法错误)
        run: |
          TARGET_FILE=$(find . -name "ColorOS17RealNotesScreen.kt" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            echo "🔧 找到 UI 文件: $TARGET_FILE，正在尝试自动修复对齐和修饰符错误..."
            
            # 修复 1：强行把错误的 Alignment 替换为正确的 Arrangement
            sed -i 's/verticalArrangement = Alignment.CenterVertically/verticalArrangement = Arrangement.Center/g' "$TARGET_FILE"
            sed -i 's/verticalArrangement = Alignment.Top/verticalArrangement = Arrangement.Top/g' "$TARGET_FILE"
            sed -i 's/verticalArrangement = Alignment.Bottom/verticalArrangement = Arrangement.Bottom/g' "$TARGET_FILE"
            
            # 修复 2：确保文件头部正确引入了 Arrangement (如果没有就加上)
            if ! grep -q "import androidx.compose.foundation.layout.Arrangement" "$TARGET_FILE"; then
              sed -i '1s/^/import androidx.compose.foundation.layout.Arrangement\n/' "$TARGET_FILE"
            fi
            
            echo "✅ 自动修复完成，准备编译。"
          else
            echo "⚠️ 未找到目标文件，跳过修复。"
          fi

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 6. Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 7. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-AINotes-Final-APK
          path: app/build/outputs/apk/debug/*.apk
