name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Clean Old Files & Extract Zip
        run: |
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties
          if ls coloros17_v4_fixed*.zip 1> /dev/null 2>&1; then
            ZIP_TO_USE=$(ls -t coloros17_v4_fixed*.zip | head -n 1)
          else
            ZIP_TO_USE=$(ls -t *.zip | head -n 1)
          fi
          echo "✅ 正在解压: $ZIP_TO_USE"
          unzip -o "$ZIP_TO_USE"

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle 8.10.2 (With Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: 5. Build Debug APK
        run: |
          # 加上 --stacktrace 方便排查真正的错误
          gradle assembleDebug --no-daemon --stacktrace

      - name: 6. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-AINotes-v4-APK
          path: app/build/outputs/apk/debug/*.apk
