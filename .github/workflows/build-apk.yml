name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Clean Old Files & Extract ONLY v3 Real UI Zip
        run: |
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties
          echo "正在解压 3.0.0 真机还原版压缩包..."
          unzip -o coloros17_v3_real_ui*.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-AINotes-v3-RealUI-APK
          path: app/build/outputs/apk/debug/*.apk
