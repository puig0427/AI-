name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Auto-Unzip source.zip
        run: |
          if [ -f "source.zip" ]; then
            unzip -o source.zip
            rm -f source.zip
          else
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
              rm -f "$ZIP_FILE"
            fi
          fi

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Global Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 5. Build Debug APK
        run: |
          # 寻找 settings.gradle 所在的目录
          SETTINGS_FILE=$(find . -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "✅ 检测到项目目录在: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            # 判断是否存在 gradlew
            if [ -f "gradlew" ]; then
              echo "✅ 找到 gradlew，使用 wrapper 编译..."
              chmod +x gradlew
              ./gradlew assembleDebug --stacktrace
            else
              echo "⚠️ 未找到 gradlew，尝试使用全局 Gradle 编译..."
              # 直接把全局 gradle 当作 wrapper 来用
              gradle wrapper --gradle-version 8.10.2
              chmod +x gradlew
              ./gradlew assembleDebug --stacktrace
            fi
          else
            echo "❌ 错误：没有找到 settings.gradle 或 settings.gradle.kts 文件！"
            ls -la
            exit 1
          fi

      - name: 6. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-AINotes-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
