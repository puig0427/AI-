name: Build ColorOS 17 AI Notes APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Unzip Latest Zip in Cloud
        run: |
          echo "=== 当前仓库文件列表 ==="
          ls -la
          # 自动按时间从旧到新依次解压所有 zip，确保手机重命名的 source (1).zip 也能覆盖旧文件
          for z in $(ls -tr *.zip 2>/dev/null); do
            echo "✅ 正在解压: $z"
            unzip -o "$z"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-AINotes-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
